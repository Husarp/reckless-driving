        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            touchStartX = null;
            touchStartPlayerX = null;
        });

        // Lane-snap target for arrow/A-D presses (Batch 44): if the car body is fully within
        // its current lane, jump to the adjacent lane; if it's off-center, center first
        // Called on key release (and safe to call any time) — rounds the car's ACTUAL current
        // position to its nearest lane center. Movement while held is fully smooth/continuous
        // (Batch 48, see Player.update()) with no discrete snapping at all, so this is the only
        // place a lane-snap destination ever gets set — it's what brings the car to rest on a
        // real lane once the key is released, whether that was a quick tap or a long glide.
        function snapToNearestLane() {
            if (!player) return;
            const lw = Math.floor(ROAD_WIDTH / config.lanes);
            const carCenterX = player.x + player.width / 2;
            let lane = Math.round((carCenterX - ROAD_BORDER_LEFT - lw / 2) / lw);
            lane = Math.max(0, Math.min(config.lanes - 1, lane));
            const laneCenterX = ROAD_BORDER_LEFT + lane * lw + lw / 2;
            player.targetX = laneCenterX - player.width / 2;
        }

        function checkCollision(r1, r2) {
            return (
                r1.x < r2.x + r2.width &&
                r1.x + r1.width > r2.x &&
                r1.y < r2.y + r2.height &&
                r1.y + r1.height > r2.y
            );
        }

        function explode(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function loop() {
            // Run updates only if the game view is actively running
            if (!gameView.classList.contains('active')) {
                requestAnimationFrame(loop);
                return;
            }

            // Pause: freeze last canvas frame untouched, skip all updates. The dark overlay
            // and PAUSED text are now the #pauseHud DOM element sitting on top (see setPaused()),
            // not redrawn here — this is what fixes the old bug where the canvas-drawn overlay
            // recomposited on top of itself every frame and drifted to solid black
            if (gamePaused) {
                requestAnimationFrame(loop);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Sidewalk background
            ctx.fillStyle = '#55b65a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Left side — 14 unique slots, each 24px tall: 0=tall grass, 1=bush, 2=tree
            // Reduced density from the original 7 grass/4 bush/3 tree to 9/3/2 (Batch 16)
            {
                const LEFT_SLOTS = [0, 1, 0, 0, 2, 0, 1, 0, 0, 2, 0, 1, 0, 0]; // 14 entries
                const tilePeriod = 24;
                const numSlots = 14; // 336 / 24 = 14
                const ro = Math.floor(roadOffset % 336);
                const baseSlot = Math.floor(ro / tilePeriod);
                const pixOff = ro % tilePeriod;
                for (let ti = 0; pixOff - tilePeriod + ti * tilePeriod < canvas.height + tilePeriod; ti++) {
                    const ly = pixOff - tilePeriod + ti * tilePeriod;
                    // Slot identity must depend only on the tile's world-space position, not on
                    // baseSlot+ti directly — that combination jumps by +2 every time pixOff wraps
                    // past 0 (about every 24px of scroll), which was making tiles change type
                    // mid-scroll ("flashing"). ti - baseSlot - 1 stays constant for a given
                    // physical tile across the wrap (see CHANGELOG for the derivation).
                    const slotOffset = ti - baseSlot - 1;
                    const type = LEFT_SLOTS[((slotOffset % numSlots) + numSlots) % numSlots];
                    if (type === 2) { // tree
                        ctx.fillStyle = '#4e342e';
                        ctx.fillRect(6, ly + 15, 3, 8);   // trunk
                        ctx.fillStyle = '#1b5e20';
                        ctx.fillRect(1, ly + 5, 13, 7);   // wide crown base
                        ctx.fillRect(3, ly + 2, 9, 5);    // upper crown
                        ctx.fillRect(5, ly + 0, 5, 3);    // top
                        ctx.fillStyle = '#2d7d32';
                        ctx.fillRect(2, ly + 10, 10, 5);  // mid-crown
                    } else if (type === 1) { // bush
                        ctx.fillStyle = '#2e7d32';
                        ctx.fillRect(1, ly + 15, 12, 7);  // wide base
                        ctx.fillRect(3, ly + 12, 9, 5);   // rounded top
                        ctx.fillRect(5, ly + 10, 5, 4);   // peak
                        ctx.fillStyle = '#43a047';
                        ctx.fillRect(2, ly + 16, 9, 5);   // highlight layer
                        ctx.fillRect(4, ly + 13, 6, 4);
                    } else { // tall grass (type 0)
                        ctx.fillStyle = '#2e7d32';
                        ctx.fillRect(2, ly + 9, 1, 13);
                        ctx.fillRect(6, ly + 7, 1, 15);
                        ctx.fillRect(11, ly + 11, 1, 11);
                        ctx.fillStyle = '#43a047';
                        ctx.fillRect(4, ly + 8, 1, 14);
                        ctx.fillRect(9, ly + 10, 1, 12);
                        ctx.fillRect(13, ly + 12, 1, 10);
                    }
                }
            }

            // Curb tile height (shared by both sides)
            let tileHeight = 8;

            // Left curb (mirrored from right)
            for (let ly = -tileHeight + Math.floor(roadOffset % (tileHeight * 2)); ly < canvas.height; ly += tileHeight * 2) {
                ctx.fillStyle = '#718093';
                ctx.fillRect(ROAD_BORDER_LEFT - 2, ly, 2, tileHeight);
                ctx.fillStyle = '#f1f2f6';
                ctx.fillRect(ROAD_BORDER_LEFT - 2, ly + tileHeight, 2, tileHeight);
            }

            // Right side curbs and hedges
            ctx.fillStyle = '#55b65a';
            ctx.fillRect(ROAD_BORDER_RIGHT, 0, SIDE_MARGIN, canvas.height);

            // Right curb
            for (let ly = -tileHeight + Math.floor(roadOffset % (tileHeight * 2)); ly < canvas.height; ly += tileHeight * 2) {
                ctx.fillStyle = '#718093';
                ctx.fillRect(ROAD_BORDER_RIGHT, ly, 2, tileHeight);
                ctx.fillStyle = '#f1f2f6';
                ctx.fillRect(ROAD_BORDER_RIGHT, ly + tileHeight, 2, tileHeight);
            }

            // Right side — natural solid hedge wall (Batch 16, replaces the flashing teal
            // bush-square grid). Solid dark base plus overlapping organic foliage clumps
            // using the same world-position slot formula as the left side, so tile identity
            // never jumps mid-scroll. Base fill means there are never gaps between clumps —
            // it always reads as one continuous hedge.
            ctx.fillStyle = '#1e6f5c'; // Dark hedge base
            ctx.fillRect(ROAD_BORDER_RIGHT + 4, 0, 14, canvas.height);
            {
                const RIGHT_SLOTS = [0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 0, 1, 0, 1]; // 14 entries, 2 clump variants
                const tilePeriod = 24;
                const numSlots = 14;
                const ro = Math.floor(roadOffset % 336);
                const baseSlot = Math.floor(ro / tilePeriod);
                const pixOff = ro % tilePeriod;
                for (let ti = 0; pixOff - tilePeriod + ti * tilePeriod < canvas.height + tilePeriod; ti++) {
                    const ly = pixOff - tilePeriod + ti * tilePeriod;
                    const slotOffset = ti - baseSlot - 1;
                    const variant = RIGHT_SLOTS[((slotOffset % numSlots) + numSlots) % numSlots];
                    if (variant === 1) { // fuller clump
                        ctx.fillStyle = '#1f5f49';
                        ctx.fillRect(ROAD_BORDER_RIGHT + 4, ly + 6, 13, 15);
                        ctx.fillRect(ROAD_BORDER_RIGHT + 6, ly + 2, 9, 6);
                        ctx.fillStyle = '#2a7359';
                        ctx.fillRect(ROAD_BORDER_RIGHT + 5, ly + 8, 6, 8);
                        ctx.fillRect(ROAD_BORDER_RIGHT + 11, ly + 12, 4, 6);
                    } else { // smaller clump
                        ctx.fillStyle = '#256b52';
                        ctx.fillRect(ROAD_BORDER_RIGHT + 6, ly + 9, 10, 11);
                        ctx.fillRect(ROAD_BORDER_RIGHT + 8, ly + 6, 6, 6);
                        ctx.fillStyle = '#2f8065';
                        ctx.fillRect(ROAD_BORDER_RIGHT + 7, ly + 11, 5, 6);
                    }
                }
            }

            // Central grey asphalt road
            ctx.fillStyle = '#9ca3af';
            ctx.fillRect(ROAD_BORDER_LEFT, 0, ROAD_WIDTH, canvas.height);

            if (gameActive) {
                // Keep road, curbs, and grasses in perfect, crisp scrolling sync
                roadOffset = (roadOffset + currentSpeed) % 336; // 336 = LCM(16,24,28) — all tile periods divide evenly, no wrap jitter
                
                if (currentSpeed < maxSpeed) {
                    currentSpeed += 0.0005;
                }
            }

            // Procedural, pixel-perfect dashed road lane dividers
            let laneWidth = Math.floor(ROAD_WIDTH / config.lanes);
            let dashH = 12;
            let dashG = 16;
            let dashPeriod = dashH + dashG;

            for (let i = 1; i < config.lanes; i++) {
                let lx = ROAD_BORDER_LEFT + i * laneWidth;
                for (let ly = -dashPeriod + Math.floor(roadOffset % dashPeriod); ly < canvas.height; ly += dashPeriod) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(lx, ly, 1, dashH); // Crisp 1px wide line blocks
                }
            }

            if (gameActive) {
                // Pending ambulance warnings: draw flashing danger zone, spawn when countdown ends
                for (let i = pendingAmbulances.length - 1; i >= 0; i--) {
                    const pa = pendingAmbulances[i];
                    pa.timer--;
                    if (pa.timer <= 0) {
                        vehicles.push(new Vehicle(pa.lane, 'ambulance'));
                        pendingAmbulances.splice(i, 1);
                    } else {
                        // Flashing red danger stripe in the incoming lane
                        if (Math.floor(Date.now() / 200) % 2 === 0) {
                            const lw = Math.floor(ROAD_WIDTH / config.lanes);
                            const lx = ROAD_BORDER_LEFT + pa.lane * lw;
                            ctx.fillStyle = 'rgba(255, 50, 50, 0.55)';
                            ctx.fillRect(lx + 1, 0, lw - 2, canvas.height);
                            // Danger bar at top of lane
                            ctx.fillStyle = '#ff0000';
                            ctx.fillRect(lx + 1, 0, lw - 2, 5);
                            // White exclamation block
                            const cx = lx + Math.floor(lw / 2) - 1;
                            ctx.fillStyle = '#ffffff';
                            ctx.fillRect(cx, 1, 2, 3);
                            ctx.fillRect(cx, 5, 2, 1);
                        }
                    }
                }

                // Procedural spawning
                let spawnChance = 0.015 + (currentSpeed * 0.0012);
                if (Math.random() < spawnChance) {
                    let lane = Math.floor(Math.random() * config.lanes);
                    
                    if (canSpawnAt(lane)) {
                        let roll = Math.random();
                        if (roll < 0.02) {
                            // Queue ambulance with 3-second advance warning
                            if (!pendingAmbulances.some(pa => pa.lane === lane)) {
                                // Clear the lane so the ambulance has a straight run when it arrives
                                vehicles = vehicles.filter(v => v.lane !== lane);
                                // Warning scales down as game speeds up (2.5s base → 1s min)
                                const warnFrames = Math.max(60, Math.round(150 * baseSpeed / currentSpeed));
                                pendingAmbulances.push({lane, timer: warnFrames});
                            }
                        } else {
                            let type;
                            // Reckless share cut way down (was 0.23 of all spawns) — reckless
                            // drivers are permanent lane-changers (re-roll forever, unlike
                            // normal/truck which change once), so they alone made "most cars
                            // change lanes repeatedly" feel true even after tuning normal/truck
                            // down separately.
                            if (roll < 0.12) {
                                type = 'reckless';
                            } else if (roll < 0.32) {
                                type = 'truck';
                            } else {
                                type = 'normal';
                            }
                            vehicles.push(new Vehicle(lane, type));
                        }
                    }
                }

                player.update();

                for (let i = vehicles.length - 1; i >= 0; i--) {
                    if (!gameActive) break;
                    let v = vehicles[i];
                    v.update();
                    v.draw();

                    if (checkCollision(player, v)) {
                        if (player.abilityState === 'jumping') {
                            // immune over everything, including ambulances now
                        } else if (v.type === 'ambulance') {
                            // Ambulance = instant death (jump immunity handled above; ram still doesn't protect)
                            explode(player.x + player.width/2, player.y + player.height/2, playerColor);
                            explode(v.x + v.width/2, v.y + v.height/2, '#ff4757');
                            explode(v.x + v.width/2, v.y + v.height/2, '#4f6ef7');
                            gameActive = false;
                            gameHud.style.display = 'none';
                            hudAmb.style.display = 'none';
                            abilityBar.style.display = 'none';
                            goScore.textContent = `SCORE: ${score}`;
                            gameOverHud.style.display = 'flex';
                            stopMusic();
                            playSound('crash');
                            saveScore();
                            gameoverBtns.style.display = 'flex';
                        } else if (player.abilityState === 'ramming') {
                            explode(v.x + v.width/2, v.y + v.height/2, v.color);
                            vehicles.splice(i, 1);
                            score += Math.round(15 * multiplier);
                            ramsUsed++;
                            playSound('ram');
                            continue;
                        } else {
                            explode(player.x + player.width/2, player.y + player.height/2, playerColor);
                            explode(v.x + v.width/2, v.y + v.height/2, v.color);
                            gameActive = false;
                            gameHud.style.display = 'none';
                            hudAmb.style.display = 'none';
                            abilityBar.style.display = 'none';
                            goScore.textContent = `SCORE: ${score}`;
                            gameOverHud.style.display = 'flex';
                            stopMusic();
                            playSound('crash');
                            saveScore();
                            gameoverBtns.style.display = 'flex';
                        }
                    }

                    if (v.y > canvas.height) {
                        vehicles.splice(i, 1);
                        score += Math.round(10 * multiplier);
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();
                    if (particles[i].life <= 0) particles.splice(i, 1);
                }

                player.draw();

                // Night mode: dark overlay with headlight glow in front of player
                if (config.nightMode) {
                    ctx.fillStyle = 'rgba(0, 5, 20, 0.72)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    const hx = player.x + player.width / 2;
                    const grad = ctx.createRadialGradient(hx, player.y, 2, hx, player.y - 22, 68);
                    grad.addColorStop(0, 'rgba(255, 255, 200, 0.42)');
                    grad.addColorStop(1, 'rgba(255, 255, 200, 0)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                // UI Display text (DOM overlay — crisp at any display size)
                hudScore.textContent = `SCORE: ${score}`;
                hudMult.textContent = `MULT:  ${multiplier.toFixed(1)}x`;

                // Ambulance on-screen warning (DOM)
                const ambulanceOnScreen = vehicles.some(v => v.type === 'ambulance');
                hudAmb.style.display = (ambulanceOnScreen && Math.floor(Date.now() / 300) % 2 === 0) ? 'block' : 'none';

                // Ability bar is now a DOM overlay (#abilityBar), updated in Player.update()

            } else {
                // Game Over — dark canvas overlay (text shown via DOM #gameOverHud)
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();
                    if (particles[i].life <= 0) particles.splice(i, 1);
                }
            }

            requestAnimationFrame(loop);
        }

        // Action hooks for transitions
        startBtn.addEventListener('click', launchGame);
        retryBtn.addEventListener('click', launchGame);
        returnBtn.addEventListener('click', exitToMenu);
        pauseBtn.addEventListener('click', () => { if (gameActive) setPaused(!gamePaused); });
        resumeBtn.addEventListener('click', () => setPaused(false));
        pauseMenuBtn.addEventListener('click', exitToMenu);
        leaderboardBtn.addEventListener('click', showLeaderboard);
        backBtn.addEventListener('click', () => {
            leaderboardView.classList.remove('active');
            menuView.classList.add('active');
        });
        clearBtn.addEventListener('click', () => {
            localStorage.removeItem('highscores');
            showLeaderboard();
        });

        // Pre-calculated updates
        selectLanes.addEventListener('change', calculateMultiplier);
        selectNightMode.addEventListener('change', calculateMultiplier);
        selectSound.addEventListener('input', () => {
            const pct = Math.round(parseFloat(selectSound.value) * 100);
            document.getElementById('soundVolumeVal').textContent = pct + '%';
            localStorage.setItem('soundVolume', selectSound.value);
        });

        // Init sound volume from localStorage
        const savedVol = localStorage.getItem('soundVolume') || '0.7';
        selectSound.value = savedVol;
        document.getElementById('soundVolumeVal').textContent = Math.round(parseFloat(savedVol) * 100) + '%';

        // Car color swatch picker
        const swatches = document.querySelectorAll('.color-swatch');
        swatches.forEach(swatch => {
            if (swatch.dataset.color === playerColor) swatch.classList.add('selected');
            swatch.addEventListener('click', () => {
                swatches.forEach(s => s.classList.remove('selected'));
                swatch.classList.add('selected');
                playerColor = swatch.dataset.color;
                localStorage.setItem('playerColor', playerColor);
            });
        });

        // Inject tooltip icons from data-tip attributes
        document.querySelectorAll('.setting-group[data-tip]').forEach(group => {
            const label = group.querySelector('label');
            if (!label) return;
            const wrap = document.createElement('span');
            wrap.className = 'tip-wrap';
            const icon = document.createElement('span');
            icon.className = 'tip-icon';
            icon.textContent = 'ℹ';
            const text = document.createElement('span');
            text.className = 'tip-text';
            text.textContent = group.dataset.tip;
            wrap.appendChild(icon);
            wrap.appendChild(text);
            label.appendChild(wrap);
            icon.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const isOpen = wrap.classList.contains('open');
                document.querySelectorAll('.tip-wrap.open').forEach(w => w.classList.remove('open'));
                if (!isOpen) wrap.classList.add('open');
            });
        });
        document.addEventListener('click', () => {
            document.querySelectorAll('.tip-wrap.open').forEach(w => w.classList.remove('open'));
        });

        calculateMultiplier();
        loop();
    </script>
</body>
</html>
