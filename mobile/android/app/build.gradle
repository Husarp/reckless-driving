apply plugin: 'com.android.application'

// The APK's version comes from the project's own single source, app\version.py - the same literal
// scripts\build.ps1 checks against the game's GAME_VERSION and refuses to build on a mismatch.
// Capacitor generates this file with a frozen versionCode 1 / versionName "1.0", so without this
// every APK ever built would claim to be 1.0 while the game inside said something else.
def gameVersionName = "0.0.0"
try {
    def matcher = (file("../../../app/version.py").text =~ /VERSION\s*=\s*"([^"]+)"/)
    if (matcher) gameVersionName = matcher[0][1]
    else logger.warn("No VERSION found in app/version.py - the APK will be marked $gameVersionName")
} catch (Exception e) {
    logger.warn("Could not read app/version.py (" + e.message + ") - the APK will be marked $gameVersionName")
}
// Android wants one increasing integer, so 3.6.0 becomes 30600. Padded so a version with fewer
// than three parts still yields a number rather than failing the build.
def versionParts = (gameVersionName.tokenize('.') + ['0', '0', '0'])[0..2].collect { it.toInteger() }
def gameVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

// Release signing, Batch 556 (3.25.0) - the first version signed with a real release key instead of
// Android's per-machine debug key. The key and its password live OUTSIDE this repository, which is
// public: %USERPROFILE%\.keystores\recklessdriving-signing.properties names the .jks beside it.
// Nothing secret is committed, and nothing here needs editing on another machine except that file.
// No file, no signing config: assembleRelease then produces an UNSIGNED apk, and scripts\build.ps1
// refuses to ship it - so a missing key can never quietly fall back to a debug build.
def signingProps = new Properties()
def signingFile = new File(System.getProperty("user.home"), ".keystores/recklessdriving-signing.properties")
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace "com.husarp.recklessdriving"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.husarp.recklessdriving"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode gameVersionCode
        versionName gameVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (signingFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
